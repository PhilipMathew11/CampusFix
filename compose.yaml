services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campusfix
      MYSQL_USER: campusfix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campusfix}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campusfix-root}
    ports:
      - "3307:3306"
    volumes:
      - campusfix-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campusfix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: campusfix
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-campusfix}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  campusfix-mysql:
